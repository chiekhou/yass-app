name: win_app
description: Win (وِين) - Annuaire des établissements en Algérie

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Network
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0

  # UI Components
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  lottie: ^3.0.0
  
  # Icons
  iconsax: ^0.0.8
  
  # Navigation
  go_router: ^17.0.1

  # Forms & Validation
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0

  # Location
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Maps
  flutter_map: ^8.2.2
  latlong2: ^0.9.0

  # Image
  image_picker: ^1.0.7
  image_cropper: ^11.0.0

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.2.2
  share_plus: ^12.0.1
  package_info_plus: ^9.0.0
  connectivity_plus: ^7.0.0

  # Refresh
  pull_to_refresh: ^2.0.0

  # Rating
  flutter_rating_bar: ^4.0.1

  # Carousel
  carousel_slider: ^5.1.1

  # Loading
  flutter_spinkit: ^5.2.0

  # Toast/Snackbar
  fluttertoast: ^9.0.0

  # Deep Links
  app_links: ^6.3.3

  # Firebase / Push Notifications
  firebase_core: ^3.8.1
  firebase_messaging: ^15.2.1
  flutter_local_notifications: ^20.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#006233"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
